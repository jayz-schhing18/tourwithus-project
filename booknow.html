<body class="bg-gray-100 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">

  <!-- HEADER -->
  <header>
    <!-- navigation -->
    <nav class="bg-white dark:bg-gray-900 border-b border-transparent dark:border-gray-700">
      <div class="my-1 py-3 ">
        <div class="flex mx-4 md:mx-16 lg:mx-40 justify-between items-center">

          <div>
            <a href="./index.html">
              <h1 class="font-extrabold text-2xl sm:text-4xl lg:text-5xl tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-900 via-blue-600 to-cyan-400 drop-shadow-sm">
                 TourWithUs
              </h1>
            </a>

          </div>

          <div class="flex items-center gap-6">

            <div class="hidden md:flex md:items-center md:justify-center md:gap-5 ">

              <a class="dark:text-gray-200 dark:hover:bg-gray-700 inline-block rounded-lg px-2 py-1 text-sm font-medium transition-all duration-400 hover:bg-black hover:text-white"
                href="./hotdeals.html">Hot deals</a>
              <a class="dark:text-gray-200 dark:hover:bg-gray-700 inline-block rounded-lg px-2 py-1 text-sm font-medium transition-all duration-400 hover:bg-black hover:text-white"
                href="./contactus.html">Contact</a>
              <a class="dark:text-gray-200 dark:hover:bg-gray-700 inline-block rounded-lg px-2 py-1 text-sm font-medium transition-all duration-400 hover:bg-black hover:text-white"
                href="./aboutus.html">About</a>
            </div>

            <!-- Sign up -->
            <div id="navAction"
              class=" justify-center rounded-xl bg-white text-sm px-4 py-2 font-semibold shadow-sm ring-1 ring-inset ring-gray-300 transition-all duration-150 hover:bg-black hover:text-white sm:inline-flex group">
              <!-- Sign Up Button -->

              <button onclick="toggleModal()" class="flex gap-1 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="20px"
                  class="fill-black transition-colors duration-150 group-hover:fill-white"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                  <path
                    d="M285.7 368C384.2 368 464 447.8 464 546.3C464 562.7 450.7 576 434.3 576L77.7 576C61.3 576 48 562.7 48 546.3C48 447.8 127.8 368 226.3 368L285.7 368zM528 144C541.3 144 552 154.7 552 168L552 216L600 216C613.3 216 624 226.7 624 240C624 253.3 613.3 264 600 264L552 264L552 312C552 325.3 541.3 336 528 336C514.7 336 504 325.3 504 312L504 264L456 264C442.7 264 432 253.3 432 240C432 226.7 442.7 216 456 216L504 216L504 168C504 154.7 514.7 144 528 144zM256 312C189.7 312 136 258.3 136 192C136 125.7 189.7 72 256 72C322.3 72 376 125.7 376 192C376 258.3 322.3 312 256 312z" />
                </svg>Sign up
              </button>
            </div>
              <!-- DarkMode&LightMode Toggle -->
                    <div class="flex items-center gap-4">
                <button id="theme-toggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all">
                    <span id="theme-toggle-dark-icon" class="text-xl">🌙</span>
                    <span id="theme-toggle-light-icon" class="hidden text-xl">☀️</span>
                </button>
                    </div>
            <!-- Signup Modal -->
            <div id="signupModal"
              class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-[100]">
              <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl w-11/12 sm:w-96 shadow-2xl">
                <h2 class="text-2xl font-bold mb-2">Join TourWithus</h2>
                <p class="text-sm text-gray-500 mb-6">Create an account to manage your bookings.</p>
                <div class="space-y-4">
                  <input id="name" type="text" placeholder="Full Name"
                    class="border p-3 w-full rounded-lg outline-blue-500">
                  <input id="email" type="email" placeholder="Email"
                    class="border p-3 w-full rounded-lg outline-blue-500">
                  <input id="password" type="password" placeholder="Password"
                    class="border p-3 w-full rounded-lg outline-blue-500">
                  <button onclick="signupUser()"
                    class="bg-blue-600 hover:bg-blue-700 text-white w-full py-3 rounded-lg font-bold transition cursor-pointer">
                    Create Account
                  </button>
                  <button onclick="toggleModal()"
                    class="text-sm text-gray-400 hover:text-gray-600 w-full text-center cursor-pointer">
                    Maybe later
                  </button>
                </div>
              </div>
            </div>

            <script>
              const modal = document.getElementById('signupModal');

              // Toggle Modal visibility
              function toggleModal() {
                if (modal.classList.contains('hidden')) {
                  modal.classList.remove('hidden');
                  modal.classList.add('flex');
                } else {
                  modal.classList.add('hidden');
                  modal.classList.remove('flex');
                }
              }

              // Handle Hotel Booking Selection
              function bookHotel(hotelName) {
                const info = document.getElementById('bookingInfo');
                info.innerText = "Selected: " + hotelName;
                info.classList.remove('italic', 'text-gray-600');
                info.classList.add('font-bold', 'text-blue-700');
              }

              // Handle Signup
              function signupUser() {
                const name = document.getElementById('name').value;
                if (name.trim() !== "") {
                  alert("Registration successful for " + name);
                  toggleModal();
                } else {
                  alert("Please enter your name.");
                }
              }

              // Close modal when clicking outside of it
              window.onclick = function (event) {
                if (event.target == modal) {
                  toggleModal();
                }
              }
            </script>

          </div>
        </div>

  <!-- Mobile Dropdown Menu -->
  <div id="mobileMenu" class="hidden md:hidden bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-700 px-4 py-3 space-y-1">

    <a href="./contactus.html" class="block px-4 py-2 text-sm font-medium rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 dark:text-gray-200">Contact</a>
    <a href="./aboutus.html" class="block px-4 py-2 text-sm font-medium rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 dark:text-gray-200">About Us</a>
    <a href="./booknow.html" class="block px-4 py-2 text-sm font-medium rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 dark:text-gray-200">Book now</a>
  </div>
</nav>
  </header>

  <main class="mx-4 md:mx-16 lg:mx-40 mb-10">
    
    <!-- STEP 1: Hotels -->
    <section class="mt-8">

      <h2 class="text-2xl font-bold mb-4">Select Your Hotels</h2>
      <!-- search -->
      <div class=" bg-white shadow-md rounded-lg mt-10 ">
        <!-- Destination -->
        <div class="flex items-center px-4 py-3">
          <svg class="w-5 h-5 text-gray-500 mr-2" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z" />
          </svg>
          <div>
            <p class="text-sm text-gray-500">Hotels</p>
          </div>
        </div>
      </div>


    </section>

    <!-- STEP 2 -->
    <section class="mt-12 ">
      <h2 class="text-2xl font-bold mb-4">Your Details</h2>

      <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow grid gap-4">

        <input type="text" placeholder="Full Name" class="border p-3 rounded">
        <input type="email" placeholder="Email Address" class="border p-3 rounded">
        <input type="tel" placeholder="Phone Number" class="border p-3 rounded">

        <div class="flex justify-between mt-4">
          <button class="bg-gray-300 px-4 py-2 rounded cursor-pointer">Back</button>
          <button class="bg-blue-900 text-white px-6 py-2 rounded cursor-pointer">Continue</button>
        </div>

      </div>
    </section>

    <!-- STEP 3 -->
    <section class="mt-12">
      <h2 class="text-2xl font-bold mb-4">Review Booking</h2>

      <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow">

        <div class="flex justify-between mb-3">
          <p>Room Type:</p>
          <p class="font-bold">...</p>
        </div>

        <div class="flex justify-between mb-3">
          <p>Dates:</p>
          <p class="font-bold">...</p>
        </div>

        <div class="flex justify-between mb-3">
          <p>Total Price:</p>
          <p class="font-bold text-blue-900">...</p>
        </div>

        <div class="border-t pt-4 flex justify-between ">
          <button class="bg-gray-300 px-4 py-2 rounded cursor-pointer">Edit</button>
          <button class="bg-green-600 text-white px-6 py-2 rounded cursor-pointer">
            Confirm Booking
          </button>
        </div>

      </div>
    </section>
  </main>

    <script>
    // DarkMode & LightMode Toggle
    const themeToggleBtn = document.getElementById("theme-toggle");
    const darkIcon = document.getElementById("theme-toggle-dark-icon");
    const lightIcon = document.getElementById("theme-toggle-light-icon");

    // Apply saved theme or system preference on load
    if (localStorage.getItem("color-theme") === "dark" || (!("color-theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
        lightIcon.classList.remove("hidden");
        darkIcon.classList.add("hidden");
    } else {
        document.documentElement.classList.remove("dark");
        darkIcon.classList.remove("hidden");
        lightIcon.classList.add("hidden");
    }

    // Toggle on button click
    themeToggleBtn.addEventListener("click", function() {
        document.documentElement.classList.toggle("dark");
        if (document.documentElement.classList.contains("dark")) {
            localStorage.setItem("color-theme", "dark");
            lightIcon.classList.remove("hidden");
            darkIcon.classList.add("hidden");
        } else {
            localStorage.setItem("color-theme", "light");
            darkIcon.classList.remove("hidden");
            lightIcon.classList.add("hidden");
        }
    });
    </script>

  <script>
    function toggleMobileMenu() {
      var menu = document.getElementById('mobileMenu');
      menu.classList.toggle('hidden');
    }
  </script>
</body>

</html>
