<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f4f4f4;
    }

    .contact-section{
      width:100%;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:50px 20px;
    }

    .contact-container{
      width:100%;
      max-width:1100px;
      background:white;
      border-radius:15px;
      overflow:hidden;
      display:grid;
      grid-template-columns:1fr 1fr;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
    }

    .contact-info{
      background:#0f172a;
      color:white;
      padding:50px;
    }

    .contact-info h2{
      font-size:35px;
      margin-bottom:20px;
    }

    .contact-info p{
      margin-bottom:30px;
      line-height:1.6;
      color:#cbd5e1;
    }

    .info-box{
      margin-bottom:25px;
    }

    .info-box h4{
      margin-bottom:8px;
      color:#38bdf8;
    }

    .socials{
      margin-top:30px;
    }

    .socials a{
      text-decoration:none;
      color:white;
      margin-right:15px;
      font-size:18px;
    }

    .contact-form{
      padding:50px;
    }

    .contact-form h2{
      font-size:35px;
      margin-bottom:25px;
      color:#111827;
    }

    .input-box{
      margin-bottom:20px;
    }

    .input-box input,
    .input-box textarea{
      width:100%;
      padding:15px;
      border:1px solid #d1d5db;
      border-radius:10px;
      outline:none;
      font-size:16px;
    }

    .input-box textarea{
      resize:none;
      height:140px;
    }

    .btn{
      width:100%;
      padding:15px;
      background:#0f172a;
      color:white;
      border:none;
      border-radius:10px;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#1e293b;
    }

    @media(max-width:900px){
      .contact-container{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

  <section class="contact-section">

    <div class="contact-container">

      <!-- LEFT SIDE -->
      <div class="contact-info">

        <h2>Contact Us</h2>

        <p>
          Need help with hotel booking or tour packages?
          Our support team is ready to help you anytime.
        </p>

        <div class="info-box">
          <h4>📍 Address</h4>
          <p>Phnom Penh, Cambodia</p>
        </div>

        <div class="info-box">
          <h4>📞 Phone</h4>
          <p>+855 999 888 677</p>
        </div>

        <div class="info-box">
          <h4>✉️ Email</h4>
          <p>tourwithus@gmail.com</p>
        </div>

        <div class="info-box">
          <h4>🕒 Business Hours</h4>
          <p>Monday - Sunday | 8AM - 10PM</p>
        </div>

        <div class="socials">
          <a href="#">Facebook</a>
          <a href="#">Telegram</a>
          <a href="#">Instagram</a>
        </div>

      </div>

      <!-- RIGHT SIDE -->
      <div class="contact-form">

        <h2>Send Message</h2>

        <form>

          <div class="input-box">
            <input type="text" placeholder="Your Name" required>
          </div>

          <div class="input-box">
            <input type="email" placeholder="Your Email" required>
          </div>

          <div class="input-box">
            <input type="text" placeholder="Phone Number">
          </div>

          <div class="input-box">
            <textarea placeholder="Write your message..."></textarea>
          </div>

          <button class="btn">Send Message</button>

        </form>

      </div>

    </div>

  </section>

</body>
</html>
